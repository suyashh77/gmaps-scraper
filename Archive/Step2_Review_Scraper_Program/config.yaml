browser:
  headless: false
  restart_every_n_stores: 50

workers:
  count: 8
  restart_browser_every: 50

laptop:
  id: 1
  viewport_width_min: 1280
  viewport_width_max: 1920
  # User agents are defined in scraper.py or can be overridden here
  # user_agents: []

database:
  path: reviews.db

input:
  file_path: stores.xlsx

scraping:
  max_reviews_per_store: 1500
  batch_save_interval: 50
  max_scroll_attempts: 2000
  stall_threshold: 40
  sort_by_newest: true

rate_limiting:
  min_scroll_delay: 2.0
  max_scroll_delay: 6.0
  min_delay_between_stores: 5
  max_delay_between_stores: 10
  idle_pause_every_n_scrolls: 10
  idle_pause_min: 2.0
  idle_pause_max: 5.0
  captcha_pause_min: 1800  # 30 min
  captcha_pause_max: 3600  # 60 min

retry:
  max_retries: 3
  backoff_multiplier: 2

logging:
  level: INFO
  file: scraper.log
